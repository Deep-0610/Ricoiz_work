name: Backend syntax validation

on:
  pull_request:
    branches: [main, production/phase-1-tenant-security-tests, production/phase-2-queues-workers, production/phase-3-campaign-sms-compliance]
    paths:
      - "server/**"
      - ".github/workflows/backend-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install
      - name: Validate backend JavaScript syntax
        run: npm run check && node --check src/googleBusinessProfile.js && node --check src/middleware/tenantGuard.js
      - name: Run backend integration tests
        run: npm test
