name: Backend syntax validation

on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/backend-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate backend JavaScript syntax
        run: node --check src/index.js && node --check src/models.js && node --check src/googleBusinessProfile.js
