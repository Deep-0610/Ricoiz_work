name: Convert backend sources to JavaScript

on:
  push:
    branches:
      - migration/javascript-jsx
    paths:
      - ".github/scripts/convert-backend.mjs"
      - ".github/workflows/convert-backend.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/javascript-jsx
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install temporary transpiler
        run: npm install --no-save esbuild
      - name: Convert Convex sources and remove declarations
        run: node .github/scripts/convert-backend.mjs
      - name: Commit converted JavaScript files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A convex
          if git diff --cached --quiet; then
            echo "No source conversion changes to commit."
            exit 0
          fi
          git commit -m "Convert Convex backend from TypeScript to JavaScript"
          git push origin migration/javascript-jsx
